name: Keep Supabase Dev Alive

# Mantener Supabase Dev activo (proyecto Free pausa tras 7 dias sin actividad).
#
# v3 (2026-09-06): migracion a las claves nuevas de Supabase.
#   Las claves publicables (sb_publishable_...) NO son JWT, y la documentacion
#   de Supabase dice que van SOLO en la cabecera "apikey", nunca en
#   "Authorization: Bearer". Con la clave anon funcionaba porque era un JWT
#   valido; con la nueva, mandarla como Bearer hace que se intente verificar
#   como JWT y la peticion devuelve 401.
#   Cambio: eliminadas las tres cabeceras "Authorization: Bearer".
#   El secret sigue llamandose SUPABASE_DEV_ANON_KEY para no tocar nada mas,
#   pero su VALOR pasa a ser la clave publicable.
#
# v2 (2026-05-16): refuerzo tras detectar que la version SELECT-only no era
# suficiente. Ahora hace INSERT real + DELETE de limpieza (actividad de
# escritura, mas dificil de ignorar por Supabase).
#
# Frecuencia: cada 2 dias a las 09:00 UTC (~11:00 hora Espana).
# Tambien lanzable manualmente desde la pestana Actions.

on:
  schedule:
    - cron: '0 9 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: INSERT + DELETE keep_alive
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify secrets
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_DEV_ANON_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: faltan secrets SUPABASE_DEV_URL o SUPABASE_DEV_ANON_KEY."
            echo "Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "✓ Secrets presentes"
          # Aviso si el secret sigue llevando la clave antigua (JWT, empieza por eyJ).
          case "$SUPABASE_KEY" in
            eyJ*)
              echo "⚠  AVISO: el secret contiene todavia una clave JWT antigua (anon)."
              echo "   Supabase retira las claves anon y service_role a finales de 2026."
              echo "   Sustituye el secret por la clave publicable (sb_publishable_...)."
              ;;
            sb_publishable_*)
              echo "✓ Clave publicable en uso"
              ;;
            sb_secret_*)
              echo "ERROR: el secret contiene una clave SECRETA. Nunca aqui."
              exit 1
              ;;
          esac

      - name: INSERT row (escritura real)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
        run: |
          set -e
          echo "→ INSERT contra ${SUPABASE_URL}/rest/v1/keep_alive"
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            -X POST "${SUPABASE_URL}/rest/v1/keep_alive" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}')
          echo "HTTP status: ${HTTP_STATUS}"
          echo "Response: $(cat response.txt 2>/dev/null || true)"
          if [ "${HTTP_STATUS}" != "201" ] && [ "${HTTP_STATUS}" != "200" ]; then
            echo "✗ INSERT fallo (status ${HTTP_STATUS})"
            exit 1
          fi
          echo "✓ INSERT OK"

      - name: DELETE filas antiguas (limpieza)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
        run: |
          set -e
          # Borrar filas con mas de 30 dias (la RLS policy lo permite por ping_at)
          THIRTY_DAYS_AGO=$(date -u -d '30 days ago' +'%Y-%m-%dT%H:%M:%SZ')
          echo "→ DELETE rows con ping_at < ${THIRTY_DAYS_AGO}"
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            -X DELETE "${SUPABASE_URL}/rest/v1/keep_alive?ping_at=lt.${THIRTY_DAYS_AGO}" \
            -H "apikey: ${SUPABASE_KEY}")
          echo "HTTP status: ${HTTP_STATUS}"
          # 204 (no content) y 200 son ok. 404 tambien (no habia nada que borrar).
          if [ "${HTTP_STATUS}" != "204" ] && [ "${HTTP_STATUS}" != "200" ] && [ "${HTTP_STATUS}" != "404" ]; then
            echo "✗ DELETE fallo (status ${HTTP_STATUS})"
            cat response.txt 2>/dev/null || true
            exit 1
          fi
          echo "✓ DELETE OK"

      - name: SELECT verificacion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
        run: |
          set -e
          echo "→ SELECT verificacion del estado de la tabla"
          curl -s "${SUPABASE_URL}/rest/v1/keep_alive?select=id,ping_at&order=ping_at.desc&limit=5" \
            -H "apikey: ${SUPABASE_KEY}"
          echo ""
          echo "✓ Pings recientes listados"

      - name: Summary
        if: always()
        run: |
          echo "### Keep-Alive Supabase Dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Ejecucion: \`$(date -u +'%Y-%m-%d %H:%M UTC')\`" >> $GITHUB_STEP_SUMMARY
          echo "- Operaciones: INSERT + DELETE + SELECT contra Supabase Dev" >> $GITHUB_STEP_SUMMARY
          echo "- Frecuencia configurada: cada 2 dias a las 09:00 UTC" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "- Estado: ✅ Proyecto Dev recibe actividad de escritura real" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Estado: ❌ ALGO FALLO — revisa los logs" >> $GITHUB_STEP_SUMMARY
          fi
